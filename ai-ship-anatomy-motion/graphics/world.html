      const $ = (s) => document.querySelector(s);

      const S = (sid) => stage.scene(sid);
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
      const sm = (u) => u * u * (3 - 2 * u);
      const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);

          el.classList.toggle("on", id === active || (t >= reqT0 && t < T.s03.start && id === "p-model"));
        }
        // fade whatever the frame edge would cut in half
        for (const e of EDGE) {
          let k = 1;
          if (s > 0.6) {
            const cx = 960 + (e.x - cam.x) * s, cy = 497 + (e.y - cam.y) * s, hw = e.w * s / 2 + 10, hh = e.h * s / 2 + 10;
            const out = Math.max(0, hw - cx, cx + hw - 1920, hh - cy, cy + hh - 1080);
            k = clamp(1 - out / 120, 0.08, 1);
          }
          e.el.style.filter = k < 0.999 ? `opacity(${k.toFixed(3)})` : "";

        let px = 2050, py = 980, pv = 0;
        if (t >= reqT0 && t < T.s03.start) pv = seg(t, reqT0, reqT0 + 0.4) * (1 - seg(t, T.s03.start - 0.6, T.s03.start - 0.2));
        if (t >= T.s13.start) {
          pv = seg(t, T.s13.start + 0.8, T.s13.start + 1.2) * (1 - seg(t, T.s14.start - 0.4, T.s14.start));
          const pts = [[T.s13.start + 0.8, 380, 300]].concat(ROUTE.map((r) => [r[0], r[1] + 120, r[2] + 40]));
          px = pts[0][1]; py = pts[0][2];
          for (let i = 1; i < pts.length; i++) {
            if (t >= pts[i - 1][0]) { const u = sm(seg(t, pts[i - 1][0], Math.max(pts[i - 1][0] + 0.05, pts[i][0]))); px = pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * u; py = pts[i - 1][2] + (pts[i][2] - pts[i - 1][2]) * u; }
          }
        }
        packetT.textContent = t >= T.s13.start ? "Request" : "Make a page that shows my week";
        packet.style.left = px + "px"; packet.style.top = py + "px";
        packet.style.transform = `scale(${(Math.max(1, 0.95 / s)).toFixed(4)})`; packet.style.opacity = pv.toFixed(3);
        // flowing dots
        for (const f of DOTS) {
          const on = t >= f.t0 && t <= f.t1;
          f.ds.forEach((c, i) => {
            if (!on) { c.setAttribute("opacity", 0); return; }
            const u = (((t - f.t0) * f.speed + i / f.ds.length) % 1 + 1) % 1, p = f.path.getPointAtLength(u * f.L);
            c.setAttribute("cx", p.x.toFixed(1)); c.setAttribute("cy", p.y.toFixed(1)); c.setAttribute("opacity", (Math.sin(u * Math.PI) * 0.95).toFixed(2));
          });
        }
        // the core breathes; its dashed ring turns
        $("#core-dash").setAttribute("transform", `rotate(${(t * 12) % 360})`);
        $("#core-glow").setAttribute("r", (300 + Math.sin(t * 1.6) * 18).toFixed(1));
        $("#route").setAttribute("stroke-dashoffset", (-t * 40).toFixed(1));
        $("#box").style.boxShadow = `0 20px 50px rgba(0,0,0,.6), 0 0 ${(40 + Math.sin(t * 2.2) * 22).toFixed(1)}px rgba(251,191,36,.45)`;
      });
      stage.finalize();
    </script>
